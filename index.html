<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Explora los mejores titulos</h1>

    <div class="tienda-container">
        <div class="card">
            <img src="https://via.placeholder.com/200x250/1c212d/00ff88?text=Halo+Infinite" alt="Halo">
            <h3>Halo Infinite</h3>
            <p class="precio">$59.99</p>
            <button>Añadir al carrito</button>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200x250/1c212d/00ff88?text=Forza+Horizon+5" alt="Forza">
        <h3>Forza Horizon 5</h3>
        <p class="precio">$49.99</p>
        <button>Añadir al carrito</button> 
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200x250/1c212d/00ff88?text=Minecraft" alt="Minecraft">
        <h3>Minecraft</h3>
        <p class="precio">$26.95</p>
        <button>Añadir al carrito</button>
    </div>

    
</body>
</html>
