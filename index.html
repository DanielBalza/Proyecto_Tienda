<body>

    <header class="main-header">
        <h1><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-device-gamepad-2">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M12 5h3.5a5 5 0 0 1 0 10h-5.5l-4.015 4.227a2.3 2.3 0 0 1 -3.923 -2.035l1.634 -8.173a5 5 0 0 1 4.904 -4.019h3.4" />

        <nav class="nav-Links">
            <a href="#">Inicio</a>
            <a href="#">Catalogo</a>
            <a href="#">Ofertas</a>
            <a href="#">Mi Cuenta</a>
        </nav>
        <div class="cart-status">
            <span class="cart-icon">🛒</span>
            <span id="contador-carrito" class="badge">0</span>
            <span class="total-header">$<span id="total-precio">0.00</span></span>
        </div>
    </header>


    <h1>Explora los mejores titulos</h1>

    <div class="tienda-container">
        <div class="card">
            <img src="https://via.placeholder.com/200x250/1c212d/00ff88?text=Halo+Infinite" alt="Halo">
            <h3>Halo Infinite</h3>
            <p class="precio">$59.99</p>
            <button onclick="agregarAlJuego('Halo Infinite', 59.99)">Añadir al carrito</button>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200x250/1c212d/00ff88?text=Forza+Horizon+5" alt="Forza">
        <h3>Forza Horizon 5</h3>
        <p class="precio">$49.99</p>
        <button onclick="agregarAlJuego('Forza Horizon 5', 49.99)">Añadir al carrito</button> 
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200x250/1c212d/00ff88?text=Minecraft" alt="Minecraft">
        <h3>Minecraft</h3>
        <p class="precio">$26.95</p>
        <button onclick="agregarAlJuego('Minecraft', 26.95)">Añadir al carrito</button>
    </div>
